<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Grid -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.75" stroke-dasharray="2 2"/>
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="16" fill="#FAFAFF"/>
  <rect width="800" height="520" fill="url(#grid)"/>

  <!-- Left Card: Raw Invoice Document Flow -->
  <g filter="url(#shadow)">
    <rect x="48" y="70" width="280" height="380" rx="12" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Document Header Badge -->
    <rect x="72" y="94" width="90" height="20" rx="4" fill="#EEF2FF"/>
    <text x="78" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#4F46E5">FAKTUR PAJAK</text>
    <text x="72" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">010.002-26.88219012</text>
    <text x="72" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">PT Telkom Prima Nusantara</text>

    <!-- Scan Line / OCR highlight effect -->
    <rect x="68" y="174" width="240" height="26" rx="4" fill="#4F46E5" fill-opacity="0.08" stroke="#4F46E5" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="80" cy="187" r="4" fill="#4F46E5"/>
    <text x="92" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1E293B">NPWP: 01.345.678.9-012.000</text>

    <!-- Document Lines Skeleton -->
    <rect x="72" y="220" width="232" height="10" rx="3" fill="#E2E8F0"/>
    <rect x="72" y="240" width="180" height="10" rx="3" fill="#F1F5F9"/>
    <rect x="72" y="260" width="200" height="10" rx="3" fill="#F1F5F9"/>

    <!-- Detected Amount Bounding Box -->
    <rect x="68" y="300" width="240" height="56" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="80" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">DASAR PENGENAAN PAJAK (DPP)</text>
    <text x="80" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Rp 45.000.000</text>
    <rect x="220" y="324" width="76" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="228" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#059669">PPN 11% OK</text>

    <!-- Status Footer -->
    <rect x="72" y="390" width="232" height="32" rx="6" fill="#F1F5F9"/>
    <circle cx="88" cy="406" r="4" fill="#059669"/>
    <text x="100" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#334155">AI Confidence Match: 99.4%</text>
  </g>

  <!-- Processing Core Bridge Connector -->
  <g>
    <path d="M 338 260 L 452 260" stroke="#4F46E5" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="395" cy="260" r="24" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <path d="M 388 260 L 393 265 L 404 254" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Card: Realtime Structured Data Extraction Card -->
  <g filter="url(#shadow)">
    <rect x="462" y="70" width="290" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect x="462" y="70" width="290" height="48" rx="12" fill="#F8FAFC"/>
    <circle cx="484" cy="94" r="5" fill="#059669"/>
    <text x="496" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Ekstraksi Terstruktur (JSON/ERP)</text>

    <!-- Field Items -->
    <!-- Field 1 -->
    <rect x="480" y="132" width="254" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="492" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">NOMOR SERI FAKTUR PAJAK</text>
    <text x="492" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">010.002-26.88219012</text>
    <rect x="680" y="142" width="46" height="20" rx="4" fill="#EEF2FF"/>
    <text x="686" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4F46E5">99.8%</text>

    <!-- Field 2 -->
    <rect x="480" y="186" width="254" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="492" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">PKP PENJUAL TERVERIFIKASI</text>
    <text x="492" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F172A">PT Telkom Prima Nusantara</text>
    <rect x="680" y="196" width="46" height="20" rx="4" fill="#EEF2FF"/>
    <text x="686" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4F46E5">98.5%</text>

    <!-- Field 3 -->
    <rect x="480" y="240" width="254" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="492" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B">NILAI TOTAL + PPN (11%)</text>
    <text x="492" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#059669">Rp 49.950.000</text>
    <rect x="680" y="250" width="46" height="20" rx="4" fill="#ECFDF5"/>
    <text x="687" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#059669">MATCH</text>

    <!-- Action Bar inside Card -->
    <rect x="480" y="306" width="254" height="42" rx="8" fill="#4F46E5"/>
    <text x="545" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Sinkron ke SAP / ERP →</text>

    <!-- Audit Traceability Tag -->
    <rect x="480" y="362" width="254" height="56" rx="6" fill="#F1F5F9"/>
    <text x="492" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569">JALUR AUDIT HUMAN-IN-THE-LOOP</text>
    <text x="492" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B">Ditugaskan ke: Dewi Lestari (Finance Lead)</text>
  </g>
</svg>

