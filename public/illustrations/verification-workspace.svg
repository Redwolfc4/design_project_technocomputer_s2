    <rect x="52" y="48" width="16" height="16" rx="4" fill="#EEF2FF"/>
    <path d="M57 52 H63 M57 56 H61 M57 60 H63" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
    <text x="76" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Invoice_Scan_GLI_9014.pdf</text>
    <rect x="306" y="46" width="78" height="20" rx="4" fill="#FEF3C7"/>
    <text x="345" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#B45309">AMBANG: 91%</text>
    <line x1="36" y1="80" x2="400" y2="80" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Document Header Skeleton -->
    <rect x="52" y="96" width="130" height="12" rx="3" fill="#94A3B8"/>
    <rect x="52" y="114" width="85" height="8" rx="2" fill="#CBD5E1"/>

    <!-- Highlighted Active OCR Bounding Box (Vendor Field) -->
    <g>
      <rect x="48" y="142" width="340" height="48" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.8"/>
