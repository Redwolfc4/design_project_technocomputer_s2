    <path d="M783 131 L785 133 L789 129" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Form Field 2: Invoice Number Field -->
    <text x="480" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.4">NOMOR INVOICE / FAKTUR</text>
    <rect x="480" y="180" width="324" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="494" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">INV/2026/02/GLI-9014</text>

    <!-- Calculation & Forensic Validation Card -->
    <rect x="480" y="230" width="324" height="98" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="480" y="230" width="4" height="98" rx="2" fill="#10B981"/>
    
    <text x="496" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E293B">Validasi Forensik &amp; Aturan Aritmatika Pajak</text>
    
    <g transform="translate(496, 264)">
      <circle cx="5" cy="5" r="4" fill="#10B981"/>
      <text x="16" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#047857">DPP Rp 18.500.000 + PPN 11% (Rp 2.035.000) = Cocok</text>
    </g>

    <g transform="translate(496, 284)">
      <circle cx="5" cy="5" r="4" fill="#10B981"/>
      <text x="16" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#047857">Rekening bank vendor cocok dengan Master Whitelist</text>
    </g>

    <g transform="translate(496, 304)">
      <circle cx="5" cy="5" r="4" fill="#3B82F6"/>
      <text x="16" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1D4ED8">Riwayat audit: Stempel waktu ISO tercatat untuk AP Lead</text>
    </g>

    <!-- Reviewer Action Buttons (PREMIUM, NEVER CLIPPED) -->
    <!-- Reject / Request Revision Button -->
    <rect x="480" y="344" width="150" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M500 365 H512 M504 361 L500 365 L504 369" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="522" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">Minta Revisi</text>

    <!-- Approve Button (Prominent Green Pill) -->
    <rect x="644" y="344" width="160" height="42" rx="8" fill="url(#successGrad)"/>
    <path d="M666 365 L671 370 L680 360" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="688" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Setujui (Approve)</text>

    <!-- Bottom reviewer info note -->
    <text x="642" y="414" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8">Reviewer: Rizky Pratama (AP Specialist) • Shift Pagi</text>
  </g>
</svg>