    <line x1="40" y1="240" x2="820" y2="240" stroke="#E2E8F0" stroke-dasharray="3 3"/>
    <line x1="40" y1="320" x2="820" y2="320" stroke="#E2E8F0" stroke-dasharray="3 3"/>
    <line x1="40" y1="400" x2="820" y2="400" stroke="#E2E8F0" stroke-dasharray="3 3"/>
