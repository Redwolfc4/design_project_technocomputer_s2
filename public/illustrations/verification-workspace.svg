    <text x="773" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#059669">98.4% Match</text>
    <line x1="460" y1="80" x2="824" y2="80" stroke="#E2E8F0" stroke-width="1"/>

