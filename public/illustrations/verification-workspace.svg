    <text x="58" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">NPWP: 02.987.654.3-054.000</text>
    <text x="372" y="223" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#059669">Valid DJP ✓</text>

