<svg width="860" height="680" viewBox="0 0 860 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <rect width="860" height="680" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Diagram Title Header -->
  <rect x="0" y="0" width="860" height="54" rx="16" fill="#FAFAFF"/>
  <text x="32" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">DIAGRAM ALUR KERJA SISTEM DOKUMENAI ENTERPRISE (END-TO-END WORKFLOW)</text>
  <line x1="0" y1="54" x2="860" y2="54" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Step 1: Input -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="220" height="56" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="65" cy="108" r="14" fill="#EEF2FF"/>
    <text x="61" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#4F46E5">1</text>
    <text x="90" y="102" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Dokumen Masuk</text>
    <text x="90" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">PDF e-Faktur, Invoice, PO</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 260 108 L 310 108" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="310,108 302,103 302,113" fill="#4F46E5"/>

  <!-- Step 2: Batch Upload & Profiling -->
  <g filter="url(#shadow)">
    <rect x="320" y="80" width="220" height="56" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="345" cy="108" r="14" fill="#EEF2FF"/>
    <text x="341" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#4F46E5">2</text>
    <text x="370" y="102" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Batch Upload &amp; Profiling</text>
    <text x="370" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Validasi tipe &amp; profiling skema</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 540 108 L 590 108" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="590,108 582,103 582,113" fill="#4F46E5"/>

  <!-- Step 3: OCR & Extraction -->
  <g filter="url(#shadow)">
    <rect x="600" y="80" width="220" height="56" rx="10" fill="url(#primaryGrad)"/>
    <circle cx="625" cy="108" r="14" fill="#FFFFFF"/>
    <text x="621" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#4F46E5">3</text>
    <text x="650" y="102" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">OCR &amp; Field Extraction</text>
    <text x="650" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#E0E7FF">Ekstraksi pasangan Key-Value</text>
  </g>

  <!-- Down Arrow from Step 3 to Decision Diamond -->
  <path d="M 710 136 L 710 180 L 430 180 L 430 200" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="430,205 425,197 435,197" fill="#4F46E5"/>

  <!-- Decision Node: Threshold & Arithmetic Check -->
  <g filter="url(#shadow)">
    <rect x="250" y="210" width="360" height="74" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="430" y="238" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400E" text-anchor="middle">Evaluasi Aturan &amp; Ambang Batas Akurasi</text>
    <text x="430" y="258" font-family="system-ui, sans-serif" font-size="11" fill="#B45309" text-anchor="middle">Skor Keyakinan ≥ 95% &amp; Formula DPP + PPN 11% Cocok?</text>
  </g>

  <!-- Branch YES (Left Side: Auto-Approved) -->
  <path d="M 250 247 L 150 247 L 150 330" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <polygon points="150,335 145,327 155,327" fill="#059669"/>
  <rect x="155" y="275" width="80" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="195" y="290" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#059669" text-anchor="middle">YA (Lolos)</text>

  <!-- Step 4A: Auto-Approved Card -->
  <g filter="url(#shadow)">
    <rect x="40" y="340" width="220" height="64" rx="10" fill="url(#successGrad)"/>
    <text x="150" y="367" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Disetujui Otomatis</text>
    <text x="150" y="385" font-family="system-ui, sans-serif" font-size="10" fill="#D1FAE5" text-anchor="middle">Straight-Through Processing</text>
  </g>

  <!-- Branch NO (Right Side: Needs Review) -->
  <path d="M 610 247 L 710 247 L 710 330" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <polygon points="710,335 705,327 715,327" fill="#D97706"/>
  <rect x="625" y="275" width="80" height="22" rx="4" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="665" y="290" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#D97706" text-anchor="middle">TIDAK (Cek)</text>

  <!-- Step 4B: Human-in-the-Loop Queue & Workspace -->
  <g filter="url(#shadow)">
    <rect x="580" y="340" width="260" height="84" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="710" y="366" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">Human-in-the-Loop Workspace</text>
    <text x="710" y="386" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Reviewer menginspeksi lembar berkas</text>
    <text x="710" y="402" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">&amp; mengoreksi nilai bounding-box</text>
  </g>

  <!-- Decisions from Human Review -->
  <!-- Decision 1: Reviewer Approves -->
  <path d="M 580 395 L 340 395 L 340 372 L 270 372" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <polygon points="265,372 273,367 273,377" fill="#059669"/>
  <rect x="360" y="382" width="130" height="20" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="425" y="396" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#059669" text-anchor="middle">Dikoreksi &amp; Disetujui</text>

  <!-- Decision 2: Reviewer Rejects -->
  <path d="M 710 424 L 710 480" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
  <polygon points="710,485 705,477 715,477" fill="#E11D48"/>
  <rect x="718" y="445" width="110" height="20" rx="4" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="773" y="459" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#E11D48" text-anchor="middle">Fisik Cacat / Buram</text>

  <!-- Rejected Card -->
  <g filter="url(#shadow)">
    <rect x="600" y="490" width="220" height="60" rx="10" fill="url(#dangerGrad)"/>
    <text x="710" y="517" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ditolak (Rejected)</text>
    <text x="710" y="534" font-family="system-ui, sans-serif" font-size="10" fill="#FFE4E6" text-anchor="middle">Catatan revisi dikirim ke vendor</text>
  </g>

  <!-- From Approved to Export / ERP -->
  <path d="M 150 404 L 150 490" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <polygon points="150,495 145,487 155,487" fill="#059669"/>

  <!-- Step 5: Export & Integration -->
  <g filter="url(#shadow)">
    <rect x="40" y="500" width="220" height="64" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <text x="150" y="527" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#065F46" text-anchor="middle">Ekspor &amp; Sinkronisasi ERP</text>
    <text x="150" y="545" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">SAP, Oracle, Webhook &amp; SPT DJP</text>
  </g>

  <!-- Connectors into Forensic Audit Trail -->
  <path d="M 260 532 L 340 532 L 340 600 L 415 600" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="420,600 412,595 412,605" fill="#4F46E5"/>

  <path d="M 600 520 L 520 520 L 520 600 L 445 600" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="440,600 448,605 448,595" fill="#4F46E5"/>

  <!-- Final Shared Foundation: Forensic Audit Trail -->
  <g filter="url(#shadow)">
    <rect x="250" y="580" width="360" height="64" rx="12" fill="#F8FAFC" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="280" cy="612" r="14" fill="#EEF2FF"/>
    <path d="M 276 612 L 279 615 L 286 607" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="606" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1E1B4B" text-anchor="middle">Audit Trail Forensik Tercatat Permanen</text>
    <text x="440" y="624" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Stempel Waktu ISO, Nama Aktor, IP Address &amp; Riwayat Status</text>
  </g>
</svg>
